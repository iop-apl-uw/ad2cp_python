[project]
name = "seaglider_nortex_adcp_processing"
version = "0.0.3"
description = "Shore side processing software for the Nortek Signature 1000 ADCP system"
readme = "Readme.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Note - these apply to the project being run stand-alone
    # When running via the Seaglider Basestation extension, the pyproject.toml for the project
    # should be used.
    "numpy==2.5.0",
    "scipy==1.18.0",
    "gsw==3.6.19",
    "netCDF4==1.7.4",
    "xarray==2026.7.0",
    "h5py==3.16.0",
    "pyproj==3.7.2",
    "cmocean==4.0.3",
    "pydantic==2.13.4",
    "PyYAML==6.0.2",
    # For SGADCPPlot figure rendering
    "kaleido==1.3.0",
    "plotly==6.8.0",
    "pillow",  # Used in image verification on the CI pipeline
    # kaleido's browser backend (choreographer) picks up the BROWSER_PATH env var set by the
    # CI pipeline; playwright's installer is used to fetch/cache that browser binary
    "playwright>=1.61.0",
]
[project.optional-dependencies]
ci = [
    ## Testing
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    ## Linting
    "ruff==0.15.17",
    # Static Typing
    "ty==0.0.32", ## Latest    
]
dev = [
    ## Static Typing
    ## Documentation (fill in)
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
    ## Misc
    "ipython==9.14.1",
    "flynt",
]
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 120
output-format = 'pylint'
include = ["./*py", "tests/*py"]
target-version = "py314"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Numpy2.0 compat
    "NPY201",
    # Check docstrings
    "D",
    # Annotations
    "ANN",
    # Require pathlib
    "PTH",

]
ignore = [
  # redundant-open-modes
  "UP015",
  # outdated-version-block
  "UP036",
]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D107", "ANN201"]
[tool.ty.src]
exclude=["BaseADCP.py","BaseADCPMission.py","DiveOcean.py","MissionOcean.py"]

[tool.coverage.html]
directory = "coverage_html_report"
[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    # netCDF4's compiled extension embeds this build-time relative path; coverage.py
    # resolves it against our project root and warns since the file doesn't exist here.
    "src/netCDF4/*",
    # Extension hooks: real coverage is measured via basestation3's own test
    # suite when adcp is loaded as an extension there, not standalone here.
    "BaseADCP.py",
    "BaseADCPMission.py",
    # Basestation plot-extension modules: import Plotting/Utils/PlotUtilsPlotly/
    # BaseOptsType, which only exist one directory up in a full basestation3
    # checkout (same reason these two are already excluded from ty type-checking
    # via [tool.ty.src] exclude) - can't even be imported standalone here.
    "DiveOcean.py",
    "MissionOcean.py",
    ]
[tool.coverage.report]
exclude_also = [
    # Extension-integration branch: which side runs is fixed for the whole
    # process by import order (whichever test happens to import BaseLog
    # first during collection), so it isn't reliably testable per-test here.
    # Real coverage of the BaseLog-import path is measured via basestation3's
    # own test suite, same rationale as the BaseADCP.py/BaseADCPMission.py
    # omit above.
    'if "BaseLog" in sys.modules:',
    "from BaseLog import",
    ]
